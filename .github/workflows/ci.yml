name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: console
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: console/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run test:desktop:policy
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:integration

  desktop:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: console
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: console/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run desktop:build
      - run: npm run test:desktop
      - run: npx electron-builder --config electron-builder.cjs --mac --dir --publish never
      - name: Test the packaged application
        run: |
          desktop_executable="$(rg --files release | rg '/Contents/MacOS/Implementation Harness$')"
          IMPL_DESKTOP_EXECUTABLE="$PWD/$desktop_executable" npm run test:desktop
